[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @campus-access/api build"

[deploy]
preDeployCommand = "pnpm --filter @campus-access/api migrate && pnpm --filter @campus-access/api import:osm"
startCommand = "pnpm --filter @campus-access/api start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
